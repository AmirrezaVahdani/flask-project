<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت مجموعه</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-md shadow-2xl">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-black text-cyan-400">قفل امنیتی سیستم باشگاه</h1>
            <p class="text-gray-400 text-xs mt-2">جهت دسترسی به داشبورد اطلاعات پرسنلی خود را وارد کنید</p>
        </header>

        <form action="{{ url_for('admin.login') }}" method="POST" class="flex flex-col gap-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-sm text-gray-400 mb-2">کد ملی (نام کاربری)</label>
                <input type="text" name="national_id" required placeholder="0000000000" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3.5 text-white focus:outline-none focus:border-cyan-500 tracking-widest text-center">
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">رمز عبور</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3.5 text-white focus:outline-none focus:border-cyan-500 text-center">
            </div>

            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl p-3.5 transition mt-2 shadow-lg shadow-cyan-600/20">🔑 ورود به کنترل پنل</button>
        </form>
    </div>

</body>
</html>
