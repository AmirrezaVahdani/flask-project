<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود اعضا | باشگاه هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="public-shell bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <main class="public-panel w-full max-w-md rounded-3xl p-7 sm:p-9">
        <div class="text-center mb-8">
            <div class="text-xs uppercase tracking-[0.25em] text-emerald-400 mb-3">SMART GYM / MEMBER</div>
            <h1 class="text-2xl font-black text-cyan-300">ورود به پنل شخصی</h1>
            <p class="text-slate-400 text-xs mt-2">مشاهده اشتراک، جلسات، مربی و کیف پول</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="space-y-2 mb-5">
                    {% for message in messages %}
                        <div class="rounded-xl border border-rose-800 bg-rose-950/40 px-4 py-3 text-xs text-rose-200">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('member.login') }}" method="POST" class="flex flex-col gap-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs text-slate-400 mb-2">کد ملی</label>
                <input name="national_id" required maxlength="10" inputmode="numeric" placeholder="کد ملی ۱۰ رقمی"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-center text-cyan-300 font-mono tracking-widest focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-2">شماره موبایل ثبت‌شده</label>
                <input name="phone_number" required maxlength="11" inputmode="tel" placeholder="مثلاً 09120000000"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-center text-slate-100 font-mono tracking-widest focus:outline-none focus:border-cyan-400">
            </div>
            <button type="submit" class="kiosk-button w-full rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black transition">ورود به پنل من</button>
        </form>
        <a href="{{ url_for('public.home') }}" class="block text-center text-xs text-slate-500 hover:text-cyan-300 mt-6">بازگشت به صفحه اصلی</a>
    </main>
</body>
</html>
