<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پنل اعضای باشگاه{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="admin-shell bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col">
    <nav class="border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <a href="{{ url_for('member.dashboard') }}" class="brand-mark font-black flex items-center gap-2">💪 <span>باشگاه هوشمند</span></a>
            <div class="flex items-center gap-2 sm:gap-4">
                <span class="hidden sm:inline text-xs text-slate-300">{{ current_user.full_name }}</span>
                <a href="{{ url_for('member.logout') }}" class="text-xs text-rose-300 border border-rose-900/60 bg-rose-950/30 rounded-lg px-3 py-2 hover:bg-rose-900/40">خروج</a>
            </div>
        </div>
    </nav>
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="space-y-2 mb-6">
                    {% for category, message in messages %}
                        <div class="rounded-xl border border-cyan-800 bg-cyan-950/40 px-4 py-3 text-sm text-cyan-100">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
