<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کیوسک ورود هوشمند باشگاه</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[120px] top-[-100px] right-[-100px]">
    </div>
    <div class="absolute w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[120px] bottom-[-100px] left-[-100px]">
    </div>

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl z-10 text-center">
        <div class="text-4xl mb-3">⚡</div>
        <h1 class="text-xl font-black text-white">پذیرش و ورود خودکار ورزشکاران</h1>
        <p class="text-slate-400 text-xs mt-1 mb-8">لطفاً کد ملی خود را وارد کرده و دکمه تایید را لمس کنید</p>

        <div class="flex flex-col gap-4">
            <input type="text" id="nationalIdInput" maxlength="10" placeholder="کد ملی ۱۰ رقمی"
                class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-center text-xl font-mono tracking-widest text-cyan-400 focus:outline-none focus:border-cyan-500 transition shadow-inner">

            <button onclick="submitCheckIn()" id="submitBtn"
                class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-black py-4 rounded-xl text-md transition shadow-lg shadow-cyan-900/30">
                🚀 ثبت ورود و تخصیص کمد
            </button>
        </div>

        <div id="errorMsg" class="mt-4 text-rose-400 text-xs font-bold hidden"></div>
    </div>

    <div id="resultModal"
        class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div
            class="bg-slate-900 border-2 border-emerald-500 max-w-sm w-full p-6 rounded-2xl text-center shadow-2xl transform scale-95 transition-all duration-300">
            <div
                class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 animate-bounce">
                ✓
            </div>
            <h2 id="modalTitle" class="text-lg font-black text-emerald-400">ورود با موفقیت ثبت شد</h2>
            <p class="text-xs text-slate-400 mt-1">خوش آمدید، روز ورزشی خوبی داشته باشید!</p>

            <div class="bg-slate-950 rounded-xl p-4 my-5 flex flex-col gap-3 text-sm border border-slate-800/80">
                <div class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-500">نام ورزشکار:</span>
                    <span id="resName" class="font-bold text-white">---</span>
                </div>
                <div class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-500">مربی مسئول:</span>
                    <span id="resTrainer" class="font-bold text-amber-400">---</span>
                </div>
                <div class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-500">جلسات باقی‌مانده:</span>
                    <span id="resSessions" class="font-bold text-cyan-400">--- جلسه</span>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <span class="text-slate-400 text-xs">🔑 شماره کمد شما:</span>
                    <span id="resLocker"
                        class="text-2xl font-black bg-emerald-500 text-slate-950 px-3 py-1 rounded-lg shadow-md animate-pulse">--</span>
                </div>
                <div class="flex justify-between items-center border-t border-slate-800 pt-2">
                    <span class="text-slate-400 text-xs">🚪 وضعیت کمد:</span>
                    <span id="resLockerStatus" class="font-bold text-cyan-400">در حال باز شدن...</span>
                </div>
            </div>

            <button onclick="closeModal()"
                class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-lg text-xs transition">
                بستن اعلان (بستن خودکار در ۵ ثانیه)
            </button>
        </div>
    </div>

    <script>
        let autoCloseTimer;

        function submitCheckIn() {
            const input = document.getElementById('nationalIdInput');
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorMsg');

            errorBox.classList.add('hidden');
            if (input.value.trim() === "") return;

            btn.disabled = true;
            btn.innerText = "⏳ در حال پردازش...";

            fetch('/api/gate/check-in', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ national_id: input.value.trim() })
            })
                .then(res => res.json())
                .then(data => {
                    btn.disabled = false;
                    btn.innerText = "🚀 ثبت ورود و تخصیص کمد";

                    if (data.success) {
                        // پر کردن پاپ‌آپ با اطلاعات دیتابیس پویا
                        document.getElementById('resName').innerText = data.full_name;
                        document.getElementById('resTrainer').innerText = data.trainer_name;
                        document.getElementById('resSessions').innerText = data.remaining_sessions !== undefined ? data.remaining_sessions + " جلسه" : "نامحدود";
                        document.getElementById('resLocker').innerText = data.assigned_locker;
                        document.getElementById('resLockerStatus').innerText = data.locker_opened ? `باز شد و برای ${data.locker_open_duration || 30} ثانیه باز می‌ماند` : 'امکان باز شدن کمد وجود ندارد';

                        // نمایش پاپ آپ
                        document.getElementById('resultModal').classList.remove('hidden');
                        input.value = ""; // پاک کردن اینپوت برای نفر بعدی

                        // تایمر ۵ ثانیه‌ای برای بستن خودکار پاپ‌آپ
                        clearTimeout(autoCloseTimer);
                        autoCloseTimer = setTimeout(closeModal, 5000);
                    } else {
                        errorBox.innerText = data.error;
                        errorBox.classList.remove('hidden');
                    }
                })
                .catch(err => {
                    btn.disabled = false;
                    btn.innerText = "🚀 ثبت ورود و تخصیص کمد";
                    errorBox.innerText = "خطا در اتصال به سرور گیت.";
                    errorBox.classList.remove('hidden');
                });
        }

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
            clearTimeout(autoCloseTimer);
            document.getElementById('nationalIdInput').focus();
        }

        // زدن اینتر در کیبورد کار دکمه را انجام دهد
        document.getElementById('nationalIdInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitCheckIn();
        });
    </script>
</body>

</html>
